# Hosts that are recognised but are neither trackers nor LLM providers (Stage 4).
# cdn_static: libraries, fonts and static assets. known_service: large platforms, stores and
# reference sites. Both are still labelled third party unless they match the extension itself.
cdn_static:
  - jsdelivr.net
  - cdnjs.cloudflare.com
  - unpkg.com
  - gstatic.com
  - fonts.googleapis.com
  - ajax.googleapis.com
  - bootstrapcdn.com
  - fontawesome.com
  - typekit.net
  - cloudfront.net
  - githubusercontent.com
  - googleusercontent.com
  - amazonaws.com
  - azureedge.net
  - fastly.net
  - akamaized.net
known_service:
  - google.com
  - googleapis.com
  - youtube.com
  - youtu.be
  - github.com
  - github.io
  - linkedin.com
